<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}iframe{display:block;border:none;width:1200px;height:800px}</style></head>
<body>
<iframe id="f" src="/admin.html"></iframe>
<script>
var f = document.getElementById('f');
setTimeout(function () {
  var doc = f.contentDocument;
  var out = {};
  out.loginVisible = getComputedStyle(doc.getElementById('login-wrap')).display;
  var tok = doc.getElementById('login-token');
  tok.value = 'WRONG_TOKEN_XYZ';
  doc.getElementById('login-btn').click();
  setTimeout(function () {
    out.badTokenErr = doc.getElementById('login-err').textContent;
    tok.value = 'mal-muscial-2026';
    doc.getElementById('login-btn').click();
    setTimeout(function () {
      out.consoleShown = getComputedStyle(doc.getElementById('console')).display;
      out.dashboardTitle = (doc.querySelector('.console-main h1') || {}).textContent;
      document.title = JSON.stringify(out);
    }, 600);
  }, 400);
}, 2500);
</script>
</body></html>
